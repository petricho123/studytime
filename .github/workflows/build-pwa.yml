name: Build and deploy PWA

on:
  push:
    branches: [main]
    paths:
      - 'pwa/**'
      - 'app/src/main/assets/**'
      - '.github/workflows/build-pwa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studytime-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build web app
        run: node pwa/build.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
