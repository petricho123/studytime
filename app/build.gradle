plugins { id 'com.android.application' }

android {
    namespace 'com.petricho.threedays'
    compileSdk 35
    defaultConfig {
        applicationId 'com.petricho.threedays'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '2.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            storeFile rootProject.file("signing/development.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        personal {
            if (System.getenv('PLANNER_KEYSTORE_PATH')) {
                storeFile file(System.getenv('PLANNER_KEYSTORE_PATH'))
                storePassword System.getenv('PLANNER_KEYSTORE_PASSWORD')
                keyAlias System.getenv('PLANNER_KEY_ALIAS')
                keyPassword System.getenv('PLANNER_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            if (System.getenv('PLANNER_KEYSTORE_PATH')) signingConfig signingConfigs.personal
        }
    }
}
